name: Rebuild image matrix

# Full rebuild across every supported image. Fans out over the pool of
# self-hosted macOS runners (4 registered), so wall-clock is roughly
# ceil(images / 4) * ~70min instead of images * ~70min.
on:
  workflow_dispatch:
    inputs:
      max_parallel:
        description: "Concurrent builds. 2 is evidenced on this host; 3 is the current default and unproven. Drop to 2 if guests stall at 'Waiting for SSH' with a disk that never grows."
        required: false
        default: "3"
      publish:
        description: "Attach OVAs to a GitHub release"
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]

permissions:
  contents: write

jobs:
  # One tag for the whole run. Each build job computing its own date would split
  # a run that crosses midnight across two releases, with half the images in
  # each — and nothing would report an error.
  tag:
    runs-on: [self-hosted, macOS, hypervisor]
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        run: echo "tag=v$(date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

  matrix:
    needs: tag
    strategy:
      # Never cancel siblings: a failure in one image must not discard three
      # other 70-minute builds that are already most of the way through.
      fail-fast: false
      # The old value of 1 rested on a misdiagnosis. It cited "the VirtualBox
      # installer wedged 12s in" as evidence of contention — that was the 4MB
      # VRAM bug (see TROUBLESHOOTING.md), which happens at any parallelism,
      # including a single build on an idle host. The VMware half of that
      # evidence was an RCU stall in vmwgfx, also a graphics path.
      #
      # Since the VRAM fix, two concurrent builds have completed cleanly on this
      # host four times (rocky9+alma9, alma10+rocky10, and both VirtualBox
      # pairs), with host load around 3 on 16 cores.
      #
      # 3 is the operator's choice and is NOT yet proven — watch the first run.
      # If guests stall, the signature is a build sitting at "Waiting for SSH"
      # with a disk that never grows; drop back to 2, which is evidenced.
      max-parallel: ${{ fromJSON(inputs.max_parallel || '3') }}
      matrix:
        include:
          - { target: rocky9,     hypervisor: fusion,     fips: "no"  }
          - { target: rocky9,     hypervisor: virtualbox, fips: "no"  }
          - { target: rocky9,     hypervisor: fusion,     fips: "yes" }
          - { target: rocky9,     hypervisor: virtualbox, fips: "yes" }
          - { target: rocky10,    hypervisor: fusion,     fips: "no"  }
          - { target: rocky10,    hypervisor: virtualbox, fips: "no"  }
          - { target: rocky10,    hypervisor: fusion,     fips: "yes" }
          - { target: rocky10,    hypervisor: virtualbox, fips: "yes" }
          # FIPS is EL-only: Ubuntu's certified modules come through Ubuntu Pro,
          # whose redistribution terms are unresolved for a public image.
          - { target: alma9,      hypervisor: fusion,     fips: "no"  }
          - { target: alma9,      hypervisor: virtualbox, fips: "no"  }
          - { target: alma10,     hypervisor: fusion,     fips: "no"  }
          - { target: alma10,     hypervisor: virtualbox, fips: "no"  }
          - { target: ubuntu2404, hypervisor: fusion,     fips: "no"  }
          - { target: ubuntu2404, hypervisor: virtualbox, fips: "no"  }
    uses: ./.github/workflows/build-images.yml
    with:
      target: ${{ matrix.target }}
      hypervisor: ${{ matrix.hypervisor }}
      fips: ${{ matrix.fips }}
      publish: ${{ inputs.publish }}
      release_tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit

  # ONE manifest for the whole release, built after the matrix from the
  # release's own assets.
  #
  # make-manifest.sh cannot do this job: it globs build/packer in a single
  # workspace, and the matrix fans out over several runners, so each job sees
  # only the images it built. Generating per job would publish a manifest
  # describing a subset of the release while looking complete, with
  # `--clobber` handing the result to whichever job finished last.
  #
  # always(): a partial matrix still deserves an accurate manifest of what did
  # publish. The script warns loudly about any image whose evidence is missing.
  manifest:
    needs: [tag, matrix]
    if: ${{ always() && inputs.publish == 'yes' }}
    runs-on: [self-hosted, macOS, hypervisor]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and publish manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="${{ needs.tag.outputs.tag }}"
          ./make-manifest-from-release.sh "$TAG"
          gh release upload "$TAG" manifest.json --clobber
          echo "manifest published to $TAG"
