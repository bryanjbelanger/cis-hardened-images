name: Build hardened images

# Builds run on a self-hosted macOS runner because they drive VMware Fusion and
# VirtualBox directly — a hypervisor cannot run inside a GitHub-hosted runner or
# a Kubernetes pod (which is also why the ARC runners in the cluster cannot serve
# this repo).
on:
  workflow_call:
    inputs:
      target:      { required: true,  type: string }
      hypervisor:  { required: true,  type: string }
      fips:        { required: false, type: string, default: "no" }
      publish:     { required: false, type: string, default: "no" }
      # Passed down by build-matrix.yml so every job in a run targets ONE
      # release. Each job computing its own date splits a run that crosses
      # midnight across two tags — half the images in each.
      release_tag: { required: false, type: string, default: "" }
  workflow_dispatch:
    inputs:
      target:
        description: "Target from targets/ (rocky9, rocky10, ubuntu2404, ...)"
        required: true
        default: rocky9
      hypervisor:
        description: "fusion or virtualbox"
        required: true
        default: fusion
        type: choice
        options: [fusion, virtualbox]
      fips:
        description: "Enable FIPS mode (EL targets only)"
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]
      publish:
        description: "Attach the OVA to a GitHub release"
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]
  schedule:
    # Monthly canary for CVE currency. Full-matrix rebuilds go through
    # build-matrix.yml, which fans out across the runner pool.
    - cron: "0 7 1 * *"

# Scoped per image, NOT global: different target/hypervisor/fips combinations
# build in parallel across the runner pool. The key is the VM name — two runs
# of the SAME combination would fight over one VM, so that is what we serialize.
concurrency:
  group: image-${{ inputs.target || 'rocky9' }}-${{ inputs.hypervisor || 'fusion' }}-${{ inputs.fips || 'no' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, macOS, hypervisor]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Preflight
        run: |
          set -e
          echo "target=${{ inputs.target || 'rocky9' }} hypervisor=${{ inputs.hypervisor || 'fusion' }} fips=${{ inputs.fips || 'no' }}"
          for t in xorriso hdiutil VBoxManage; do command -v $t >/dev/null || { echo "MISSING: $t"; exit 1; }; done
          test -x "/Applications/VMware Fusion.app/Contents/Library/VMware OVF Tool/ovftool" || { echo "MISSING: ovftool"; exit 1; }
          df -g / | tail -1 | awk '{ if ($4 < 40) { print "LOW DISK: " $4 "GB free, need ~40GB"; exit 1 } else print "disk ok: " $4 "GB free" }'

      - name: Build credentials
        env:
          PW_ROOT_BUILD: ${{ secrets.PW_ROOT_BUILD }}
          PW_BUILDER: ${{ secrets.PW_BUILDER }}
        run: |
          # Build passwords are not shipped secrets — the seal step locks root
          # and expires builder — but they must not land in the repo either.
          # Fall back to the runner's existing local-creds.env when the secrets
          # are not configured, so a hand-run on this Mac still works.
          if [ -n "$PW_ROOT_BUILD" ] && [ -n "$PW_BUILDER" ]; then
            printf 'PW_ROOT_BUILD=%s\nPW_BUILDER=%s\n' "$PW_ROOT_BUILD" "$PW_BUILDER" > local-creds.env
            echo "credentials written from repository secrets"
          elif [ -f "$HOME/cis-build-creds/local-creds.env" ]; then
            cp "$HOME/cis-build-creds/local-creds.env" local-creds.env
            echo "credentials taken from the runner's local store"
          else
            echo "No credentials: set PW_ROOT_BUILD/PW_BUILDER secrets, or place"
            echo "local-creds.env in ~/cis-build-creds/ on the runner."
            exit 1
          fi
          chmod 600 local-creds.env

      - name: Render and validate
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q pykickstart passlib pyyaml
          FIPS=${{ inputs.fips || 'no' }} ./render.sh "${{ inputs.target || 'rocky9' }}"
          ./validate.sh "${{ inputs.target || 'rocky9' }}"

      # This is a real, headless build — install through export. The comment
      # that used to sit here said the workflow stopped at validated inputs
      # because VM lifecycle was still driven interactively through the MCP
      # servers; build-packer.sh replaced that and the note went stale.
      - name: Build image
        run: |
          # build-packer.sh owns cleanup ordering, render isolation and the
          # hypervisor-specific quirks. Do not inline packer here.
          ./build-packer.sh "${{ inputs.target }}" "${{ inputs.hypervisor }}" "${{ inputs.fips }}"

      - name: Publish artifacts
        if: ${{ inputs.publish == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Date lives in the TAG so asset names stay stable and resolvable
          # from "latest". Consumers (the desktop-hypervisor-mcp image catalog)
          # select a release by tag, then match asset names EXACTLY.
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="v$(date +%Y.%m.%d)"
          # --prerelease: these are published for review before being promoted.
          # Promote deliberately with `gh release edit <tag> --prerelease=false`.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Hardened images $(date +%Y-%m-%d)" \
            --prerelease \
            --notes "CIS-hardened Linux images, built and audited with OpenSCAP.

          Verify before importing: \`shasum -a 256 -c <asset>.sha256\`

          First login is \`builder\` / \`builder\`, expired on first use. Root is locked.
          \`manifest.json\` carries full provenance for every image.

          Every failing rule is documented with remediation in the project README's
          known-exceptions log — none is an unhardened control left unattended."
          # Upload ONLY what this job built. A self-hosted runner keeps its
          # workspace between runs, so a bare build/packer/*.ova glob also
          # publishes stale OVAs from earlier runs — silently shipping an image
          # nobody asked for and that no longer matches the source.
          PREFIX="cis-${{ inputs.target }}-$( [ "${{ inputs.hypervisor }}" = fusion ] && echo vmware || echo virtualbox )"
          echo "publishing assets matching ${PREFIX}*"
          expected=""
          found=0
          for f in build/packer/${PREFIX}*; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            # Retry: multi-GB uploads over a home connection do fail transiently.
            ok=0
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber; then ok=1; break; fi
              echo "upload attempt $attempt failed for $n — retrying"
              sleep 15
            done
            [ "$ok" = 1 ] || { echo "::error::upload failed after 3 attempts: $n"; exit 1; }
            expected="$expected $n"
            found=$((found+1))
          done
          [ "$found" -gt 0 ] || { echo "::error::no artifacts matched ${PREFIX}*"; exit 1; }

          # VERIFY AGAINST THE RELEASE, not against gh's exit code. On the first
          # parallel CI run `gh release upload` reported success for a 1.4GB OVA
          # and the asset was simply not there afterwards — the job went green
          # while the release silently lacked an image. Counting attempts is not
          # evidence that anything landed.
          sleep 5
          present=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(" ")')
          missing=""
          for n in $expected; do
            case " $present " in *" $n "*) ;; *) missing="$missing $n" ;; esac
          done
          if [ -n "$missing" ]; then
            echo "::error::uploads reported success but these assets are absent from $TAG:$missing"
            exit 1
          fi
          echo "verified $found asset(s) present on $TAG"

      - name: Build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ inputs.target }}-${{ inputs.hypervisor }}-fips${{ inputs.fips }}
          path: |
            build/packer/*audit*.txt
            build/packer/*seal*.log
          if-no-files-found: warn

      - name: Cleanup credentials
        if: always()
        run: rm -f local-creds.env
